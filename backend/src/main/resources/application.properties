spring.application.name=backend
server.port=8081

# ==========================================
# 1. IBM watsonx.ai 설정 (팀원 작업물)
# ==========================================
watsonx.enabled=${WATSONX_ENABLED:true}
watsonx.api-key=${WATSONX_API_KEY:}
watsonx.project-id=${WATSONX_PROJECT_ID:}
watsonx.url=${WATSONX_URL:https://us-south.ml.cloud.ibm.com}
watsonx.model-id=${WATSONX_MODEL_ID:ibm/granite-4-h-small}

# ==========================================
# 2. IBM Speech to Text (STT) 설정
# ==========================================
ibm.stt.enabled=${IBM_STT_ENABLED:true}
ibm.stt.url=${IBM_STT_URL:}
ibm.stt.api-key=${IBM_STT_API_KEY:}
ibm.stt.model=${IBM_STT_MODEL:ko-KR_Multimedia}

# ==========================================
# 3. IBM Text to Speech (TTS) 설정
# ==========================================
ibm.tts.enabled=${IBM_TTS_ENABLED:true}
ibm.tts.url=${IBM_TTS_URL:}
ibm.tts.api-key=${IBM_TTS_API_KEY:}
ibm.tts.voice=${IBM_TTS_VOICE:ko-KR_HyunjunV3Voice}

# ==========================================
# 4. 국토교통부 TAGO 버스 API 설정
# ==========================================
tago.enabled=${TAGO_ENABLED:false}
tago.service-key=${TAGO_SERVICE_KEY:}