name: 기능 작업
description: 구현할 기능 또는 개선 작업을 등록합니다.
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 사용자가 얻게 되는 결과를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 포함하는 일과 포함하지 않는 일을 구분해 주세요.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
    validations:
      required: true
